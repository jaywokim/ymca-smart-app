<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMCA SMART App - Patient Dashboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🏥</span>
                    YMCA Health Dashboard
                </div>
                <div class="user-info">
                    <span id="user-name">Loading...</span>
                    <button class="btn" onclick="logout()">Logout</button>
                </div>
            </div>
        </div>
    </header>
    
    <main class="main-content">
        <div class="container">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <h2>Loading patient data...</h2>
                <p>Please wait while we fetch your health information</p>
            </div>
            
            <div id="content" style="display: none;">
                <!-- Patient Information Card -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">👤</span>
                        <h2 class="card-title">Patient Information</h2>
                    </div>
                    <div id="patient-info" class="patient-info">
                        <!-- Patient data will be loaded here -->
                    </div>
                </div>
                
                <!-- Vital Signs Card -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">💓</span>
                        <h2 class="card-title">Latest Vital Signs</h2>
                    </div>
                    <div id="vitals" class="vitals-grid">
                        <!-- Vitals will be loaded here -->
                    </div>
                </div>
                
                <!-- Recent Observations Card -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">📊</span>
                        <h2 class="card-title">Recent Observations</h2>
                    </div>
                    <div id="observations" class="observation-list">
                        <!-- Observations will be loaded here -->
                    </div>
                </div>

                <!-- YMCA Referral Card -->
                <div class="card" id="referral-card">
                    <div class="card-header">
                        <span class="card-icon">🏊‍♀️</span>
                        <h2 class="card-title">YMCA Program Referral</h2>
                    </div>
                    <div class="referral-form">
                        <div style="margin-bottom: 16px;">
                            <label for="program-select" style="display: block; margin-bottom: 8px; font-weight: 500; color: #1e293b;">Select YMCA Program:</label>
                            <select id="program-select" style="
                                width: 100%; 
                                padding: 12px; 
                                border: 1px solid #e2e8f0; 
                                border-radius: 6px; 
                                font-size: 14px;
                                background: white;
                            ">
                                <option value="">Choose a program...</option>
                                <option value="Diabetes Prevention">Diabetes Prevention Program</option>
                                <option value="Cardiac Rehabilitation">Cardiac Rehabilitation</option>
                                <option value="Arthritis Exercise">Arthritis Exercise Program</option>
                                <option value="Weight Management">Weight Management Program</option>
                                <option value="Senior Fitness">Senior Fitness Program</option>
                                <option value="Chronic Disease Management">Chronic Disease Management</option>
                            </select>
                        </div>
                        
                        <div style="margin-bottom: 16px;">
                            <label for="priority-select" style="display: block; margin-bottom: 8px; font-weight: 500; color: #1e293b;">Priority:</label>
                            <select id="priority-select" style="
                                width: 100%; 
                                padding: 12px; 
                                border: 1px solid #e2e8f0; 
                                border-radius: 6px; 
                                font-size: 14px;
                                background: white;
                            ">
                                <option value="routine">Routine</option>
                                <option value="urgent">Urgent</option>
                                <option value="asap">ASAP</option>
                            </select>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <label for="referral-notes" style="display: block; margin-bottom: 8px; font-weight: 500; color: #1e293b;">Clinical Notes:</label>
                            <textarea id="referral-notes" placeholder="Enter clinical notes, patient conditions, or specific program recommendations..." style="
                                width: 100%; 
                                height: 80px; 
                                padding: 12px; 
                                border: 1px solid #e2e8f0; 
                                border-radius: 6px; 
                                font-size: 14px;
                                resize: vertical;
                                font-family: inherit;
                            "></textarea>
                        </div>
                        
                        <button id="submit-referral-btn" onclick="handleReferralSubmission()" style="
                            background: #667eea; 
                            color: white; 
                            border: none; 
                            padding: 12px 24px; 
                            border-radius: 6px; 
                            cursor: pointer; 
                            font-size: 16px; 
                            font-weight: 500;
                            width: 100%;
                            transition: background-color 0.2s;
                        " onmouseover="this.style.background='#5a67d8'" onmouseout="this.style.background='#667eea'">
                            📤 Submit Referral to HAPI FHIR Server
                        </button>
                    </div>
                </div>
            
                <!-- Task Status & Comments Card -->
                <div class="card">
                    <div class="card-header">
                        <span class="card-icon">📋</span>
                        <h2 class="card-title">Task Status &amp; Comments</h2>
                        <button id="refresh-task-btn" class="btn btn-sm" style="margin-left: auto;">&#x21bb; Refresh</button>
                    </div>
                    <div id="task-content">
                        <!-- Task status and comments will be loaded here -->
                    </div>
                </div>
            </div>

            <div id="error" style="display: none;" class="error">
                <div class="error-icon">⚠️</div>
                <h2>Unable to load patient data</h2>
                <p id="error-message">Please try again later</p>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script src="src/app.js" type="module"></script>
    <script src="src/debug.js"></script>
</body>
</html>
