services:
  ymca-smart-app:
    build: .
    container_name: ymca-smart-app
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./smart-app-manifest.json:/usr/share/nginx/html/smart-app-manifest.json:ro
      - ./src/config/appConfig.js:/usr/share/nginx/html/src/config/appConfig.js:ro
    restart: unless-stopped
