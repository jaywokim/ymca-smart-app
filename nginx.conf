server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Correct MIME types for ES modules and JSON
    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js mjs;
        application/json            json;
        image/png                   png;
        image/jpeg                  jpg jpeg;
        image/svg+xml               svg;
        font/woff2                  woff2;
    }

    # Serve launch.html and index.html directly
    location = /launch.html {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    # Serve smart-app-manifest.json with correct content type
    location = /smart-app-manifest.json {
        add_header Content-Type application/json;
        try_files $uri =404;
    }

    # Proxy local FHIR server requests to avoid browser CORS restrictions
    location /api/fhir/ {
        resolver 127.0.0.11 valid=30s;
        set $fhir_upstream http://host.docker.internal:8080/fhir/;
        proxy_pass $fhir_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve all other static assets (src/, css, js)
    location / {
        try_files $uri $uri/ =404;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
}
