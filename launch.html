<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMCA SMART App - Launch</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .launch-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .logo {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="launch-container">
        <div class="logo">🏥</div>
        <h1>YMCA SMART App</h1>
        <p>Launching SMART on FHIR application...</p>
        <div class="spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script>
        // SMART on FHIR launch sequence
        FHIR.oauth2.authorize({
            clientId: 'ymca-smart-app',
            scope: 'launch patient/*.read',
            redirectUri: window.location.origin + '/index.html'
        }).catch(function(error) {
            console.error('Authorization error:', error);
            document.querySelector('.launch-container').innerHTML = `
                <div class="logo">⚠️</div>
                <h1>Launch Error</h1>
                <p>Unable to launch the SMART app. Please check the console for details.</p>
                <p style="font-size: 12px; color: #999;">${error.message}</p>
            `;
        });
    </script>
</body>
</html>
