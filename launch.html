<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMCA SMART App - Launch</title>
    <link rel="stylesheet" href="launch.css">
</head>
<body>
    <div class="launch-container">
        <div class="logo">🏥</div>
        <h1>YMCA SMART App</h1>
        <p>Launching SMART on FHIR application...</p>
        <div class="spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script>
        // SMART on FHIR launch sequence
        FHIR.oauth2.authorize({
            clientId: 'ymca-smart-app',
            scope: 'launch patient/*.read',
            redirectUri: window.location.origin + '/index.html'
        }).catch(function(error) {
            console.error('Authorization error:', error);
            document.querySelector('.launch-container').innerHTML = `
                <div class="logo">⚠️</div>
                <h1>Launch Error</h1>
                <p>Unable to launch the SMART app. Please check the console for details.</p>
                <p style="font-size: 12px; color: #999;">${error.message}</p>
            `;
        });
    </script>
</body>
</html>
