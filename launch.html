<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YMCA SMART App - Launch</title>
    <link rel="stylesheet" href="launch.css">
</head>
<body>
    <div class="launch-container">
        <div class="logo">🏥</div>
        <h1>YMCA SMART App</h1>
        <p>Launching SMART on FHIR application...</p>
        <div class="spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
    <script>
        (async function() {
            try {
                const response = await fetch('smart-app-manifest.json');
                if (!response.ok) {
                    throw new Error('Could not load SMART app manifest');
                }
                const manifest = await response.json();
                const iss = new URLSearchParams(location.search).get("iss") ?? '';
                const clientIds = manifest.client_ids ?? {};
                const issHostname = iss ? new URL(iss).hostname : '';
                const clientId = clientIds[issHostname];
                if (!clientId) {
                    throw new Error(`Unrecognized FHIR server: "${issHostname || iss || 'unknown'}". This vendor is not registered with the YMCA app.`);
                }
                const launchToken = new URLSearchParams(location.search).get("launch");
                const isStandalone = !launchToken;

                // EHR launch: use 'launch' scope + launch token
                // Standalone: use 'launch/patient' so Epic presents a patient picker
                const defaultEhrScope = 'launch openid fhirUser user/Patient.read user/Observation.read user/ServiceRequest.read user/PractitionerRole.read user/Practitioner.read user/Condition.read user/Coverage.read user/Organization.read';
                const defaultStandaloneScope = 'launch/patient openid fhirUser user/Patient.read user/Observation.read user/ServiceRequest.read user/PractitionerRole.read user/Practitioner.read user/Condition.read user/Coverage.read user/Organization.read';
                const scope = isStandalone
                    ? (manifest.standalone_scope ?? defaultStandaloneScope)
                    : (manifest.scope ?? defaultEhrScope);

                const redirectUri = Array.isArray(manifest.redirect_uris) && manifest.redirect_uris.length
                    ? manifest.redirect_uris[0]
                    : window.location.origin + '/index.html';

                const authorizeParams = {
                    clientId,
                    scope,
                    redirectUri,
                    iss: iss || undefined
                };
                if (!isStandalone) {
                    authorizeParams.launch = launchToken;
                }

                await FHIR.oauth2.authorize(authorizeParams);
            } catch (error) {
                console.error('Authorization error:', error);
                document.querySelector('.launch-container').innerHTML = `
                    <div class="logo">⚠️</div>
                    <h1>Launch Error</h1>
                    <p>Unable to launch the SMART app. Please check the console for details.</p>
                    <p style="font-size: 12px; color: #999;">${error.message}</p>
                `;
            }
        })();
    </script>
</body>
</html>
